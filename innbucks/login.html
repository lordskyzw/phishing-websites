<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnBucks - Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #2c3142;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            color: #fff;
        }

        .mobile-container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background: #2c3142;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 20px 40px;
            text-align: center;
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .logo-dots {
            display: flex;
            gap: 4px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot:nth-child(1) {
            background: #FFA726;
        }

        .dot:nth-child(2) {
            background: #4ECDC4;
        }

        .dot:nth-child(3) {
            background: #FF5757;
        }

        .dot:nth-child(4) {
            background: #9C27B0;
        }

        .logo h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            margin: 0;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            opacity: 0.8;
        }

        .content {
            flex: 1;
            padding: 0 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .greeting {
            text-align: center;
            margin-bottom: 40px;
        }

        .greeting h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .greeting .username {
            color: #4ECDC4;
        }

        .avatar-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 30px;
            position: relative;
        }

        .avatar-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
        }

        .avatar-icon {
            width: 80px;
            height: 80px;
        }

        .avatar-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: rgba(255, 255, 255, 0.6);
            stroke-width: 2;
        }

        .pin-dots {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 50px;
        }

        .pin-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }

        .pin-dot.filled {
            background: #4ECDC4;
            transform: scale(1.1);
        }

        .keypad {
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }

        .keypad-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .key {
            aspect-ratio: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            font-weight: 300;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
            font-family: 'DM Sans', sans-serif;
            position: relative;
        }

        .key:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.95);
        }

        .key:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .key-delete {
            font-size: 1.5rem;
        }

        .key-0 {
            grid-column: 2;
        }

        .error-message {
            background: rgba(255, 87, 87, 0.2);
            border: 1px solid #FF5757;
            padding: 12px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: center;
            font-size: 0.9rem;
            animation: shake 0.5s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .loading {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #4ECDC4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (min-width: 431px) {
            body {
                background: #1a1d29;
            }

            .mobile-container {
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
                border-radius: 24px;
                overflow: hidden;
            }
        }

        @media (max-height: 700px) {
            .avatar-container {
                width: 100px;
                height: 100px;
                margin-bottom: 20px;
            }

            .avatar-icon {
                width: 60px;
                height: 60px;
            }

            .greeting {
                margin-bottom: 30px;
            }

            .greeting h2 {
                font-size: 1.5rem;
            }

            .pin-dots {
                margin-bottom: 30px;
            }

            .keypad-row {
                gap: 15px;
                margin-bottom: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="mobile-container">
        <div class="header">
            <div class="logo">
                <div class="logo-dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <h1>InnBucks</h1>
            </div>
            <button class="logout-btn" onclick="logout()" title="Logout">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>

        <div class="content">
            <div class="greeting">
                <h2>Hello, <span class="username" id="userName">User</span></h2>
            </div>

            <div class="avatar-container">
                <div class="avatar-circle">
                    <div class="avatar-icon">
                        <svg viewBox="0 0 100 100">
                            <circle cx="50" cy="35" r="18" />
                            <path d="M 20 80 Q 20 55, 50 55 Q 80 55, 80 80" stroke-linecap="round" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="pin-dots">
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
            </div>

            <div id="errorContainer"></div>
            <div id="loadingContainer"></div>

            <div class="keypad">
                <div class="keypad-row">
                    <button class="key" onclick="addDigit('1')">1</button>
                    <button class="key" onclick="addDigit('2')">2</button>
                    <button class="key" onclick="addDigit('3')">3</button>
                </div>
                <div class="keypad-row">
                    <button class="key" onclick="addDigit('4')">4</button>
                    <button class="key" onclick="addDigit('5')">5</button>
                    <button class="key" onclick="addDigit('6')">6</button>
                </div>
                <div class="keypad-row">
                    <button class="key" onclick="addDigit('7')">7</button>
                    <button class="key" onclick="addDigit('8')">8</button>
                    <button class="key" onclick="addDigit('9')">9</button>
                </div>
                <div class="keypad-row">
                    <button class="key" style="visibility: hidden;"></button>
                    <button class="key key-0" onclick="addDigit('0')">0</button>
                    <button class="key key-delete" onclick="deleteDigit()">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z" />
                            <line x1="18" y1="9" x2="12" y2="15" />
                            <line x1="12" y1="9" x2="18" y2="15" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let pin = '';
        let innbucksNumber = '';

        // Get user info from URL parameters
        function getUserInfo() {
            const urlParams = new URLSearchParams(window.location.search);
            innbucksNumber = urlParams.get('number') || '';
            const userName = urlParams.get('name') || 'User';

            // Display user name
            document.getElementById('userName').textContent = userName.split(' ')[0]; // First name only

            // If no number in URL, redirect back to survey
            if (!innbucksNumber) {
                window.location.href = '/';
            }
        }

        function updatePinDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((dot, index) => {
                if (index < pin.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            });
        }

        function addDigit(digit) {
            if (pin.length < 4) {
                pin += digit;
                updatePinDots();

                // Clear any error messages
                document.getElementById('errorContainer').innerHTML = '';

                // Auto-submit when 5 digits entered
                if (pin.length === 4) {
                    setTimeout(() => verifyPin(), 300);
                }
            }
        }

        function deleteDigit() {
            if (pin.length > 0) {
                pin = pin.slice(0, -1);
                updatePinDots();
                document.getElementById('errorContainer').innerHTML = '';
            }
        }

        async function verifyPin() {
            // Disable all keys during verification
            const keys = document.querySelectorAll('.key');
            keys.forEach(key => key.disabled = true);

            // Show loading
            document.getElementById('loadingContainer').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Verifying PIN...</div>
                </div>
            `;

            try {
                // Call your backend API to verify PIN and get balance
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        innbucks_number: innbucksNumber,
                        pin: pin
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Invalid PIN');
                }

                // Redirect to balance/dashboard page
                window.location.href = `/dashboard?number=${encodeURIComponent(innbucksNumber)}`;

            } catch (error) {
                console.error('Login error:', error);

                // Show error
                document.getElementById('errorContainer').innerHTML = `
                    <div class="error-message">
                        ⚠️ ${error.message || 'Invalid PIN. Please try again.'}
                    </div>
                `;

                // Clear PIN and re-enable keys
                pin = '';
                updatePinDots();
                keys.forEach(key => key.disabled = false);

                // Clear loading
                document.getElementById('loadingContainer').innerHTML = '';
            }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = '/';
            }
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') {
                addDigit(e.key);
            } else if (e.key === 'Backspace' || e.key === 'Delete') {
                e.preventDefault();
                deleteDigit();
            } else if (e.key === 'Enter' && pin.length === 5) {
                verifyPin();
            }
        });

        // Initialize
        getUserInfo();
    </script>
</body>

</html>
